stack=web-vite
branch.base=develop
# O build roda as quatro etapas em sequência e para na primeira que falhar. O orquestrador divide a linha em espaços
# e roda sem shell; por isso o encadeamento é feito pelo shell de cada sistema: no Windows, cmd.exe com &&; no Linux,
# sh com eval dos argumentos (o script do -c não pode ter espaço).
build.comando.windows=cmd /d /s /c npm ci && npm run lint && npm test && npm run build
build.comando.unix=sh -c eval${IFS}"$*" sh npm ci && npm run lint && npm test && npm run build
build.ambiente.VITE_SITE_URL=https://exemplo.test
# Na web, o orquestrador roda o build.preparar uma vez, logo depois de criar o worktree e antes do Tester (ou do
# Desenvolvedor no modo rápido), porque o worktree novo não tem node_modules. Antes de cada build ele não roda: a
# cadeia do build já começa com npm ci. O npm é resolvido como npm.cmd no Windows pelo próprio orquestrador.
build.preparar.windows=npm ci
build.preparar.unix=npm ci
ciclos.maximo=3
etapa.timeout.minutos=30
tarefas.maximo=8
verificacao.rodadas.maximo=1
# O site não tem banco: a chave é obrigatória e aponta para uma pasta que não existe no projeto.
migrations.pasta=migrations
front.pastas=src,public
front.direcao=docs/design/direcao-visual.md
testes.aceitacao.pasta=src/test/aceitacao
testes.aceitacao.comando.windows=npx vitest run {classes} --reporter=junit --outputFile=.time/junit/junit.xml
testes.aceitacao.comando.unix=npx vitest run {classes} --reporter=junit --outputFile=.time/junit/junit.xml
testes.relatorios.pasta=.time/junit
testes.correcao.maximo=2
# Obrigatória no carregador; a stack web não a usa (a pré-verificação web procura módulo ausente em node_modules).
testes.pacote.base=portfolio
telas.comando.windows=node .claude/telas.mjs
telas.comando.unix=node .claude/telas.mjs
telas.pasta=.time/telas
novidades.pasta=docs/novidades
perfis=front
perfis.com.front=front
perfil.front.skills=design:design-system,design:accessibility-review,design:ux-copy
modo.simples.perfil=front
modo.simples.perfil.tela=front
seguranca.semgrep.configs=p/typescript,p/react,p/secrets
seguranca.dependencias=npm-audit
# Obrigatória no carregador; sem uso com seguranca.dependencias=npm-audit.
ferramentas.dependency-check.versao=13.0.0
claude.executavel=claude
rapido.caminhos.sensiveis=.github/**,vite.config.ts,index.html
